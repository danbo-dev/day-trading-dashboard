name: Intraday Signal Monitor

on:
  schedule:
      - cron: 5,10,15,20,25,30,35,40,45,50,55 13-20 * * 1-5
        workflow_dispatch:

        jobs:
          monitor:
              runs-on: ubuntu-latest
                  permissions:
                        contents: write
                            steps:
                                  - uses: actions/checkout@v4
                                        - uses: actions/setup-python@v5
                                                with:
                                                          python-version: "3.11"
                                                                - run: pip install yfinance pandas numpy pytz requests
                                                                      - run: python signal_monitor.py
                                                                            - run: |
                                                                                      git config user.name  "github-actions[bot]"
                                                                                                git config user.email "github-actions[bot]@users.noreply.github.com"
                                                                                                          git add signals.json
                                                                                                                    git diff --staged --quiet || git commit -m "Signals update [skip ci]"
                                                                                                                              git push
