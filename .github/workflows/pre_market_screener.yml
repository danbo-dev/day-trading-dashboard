name: Pre-Market Screener

on:
  schedule:
      - cron: 0 14 * * 1-5
        workflow_dispatch:

        jobs:
          screen:
              runs-on: ubuntu-latest
                  permissions:
                        contents: write
                            steps:
                                  - uses: actions/checkout@v4
                                        - uses: actions/setup-python@v5
                                                with:
                                                          python-version: "3.11"
                                                                - run: pip install yfinance pandas numpy pytz requests
                                                                      - run: python screener.py
                                                                            - run: |
                                                                                      git config user.name  "github-actions[bot]"
                                                                                                git config user.email "github-actions[bot]@users.noreply.github.com"
                                                                                                          git add watchlist.json
                                                                                                                    git diff --staged --quiet || git commit -m "Screener: daily watchlist [skip ci]"
                                                                                                                              git push
